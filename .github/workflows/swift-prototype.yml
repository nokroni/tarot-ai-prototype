name: Swift Prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-program:
    name: WeChat Mini Program
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Node toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate Mini Program
        run: npm run validate:mp

  package:
    name: Swift Package
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Describe package
        run: swift package describe

      - name: Test package
        run: swift test

      - name: Build package
        run: swift build

      - name: Run CLI smoke test
        run: swift run tarot-prototype

  ios-core:
    name: iOS Core Compile
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile TarotCore for iOS
        run: |
          xcodebuild \
            -scheme TarotCore \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            build

  ui-screenshots:
    name: iPhone UI Screenshots
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Capture simulator screenshots
        run: bash .github/scripts/capture-ios-screenshot.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        with:
          name: iphone-ui-screenshots
          path: artifacts/screenshots
