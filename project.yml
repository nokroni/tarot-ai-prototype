name: TarotAI

options:
  bundleIdPrefix: com.nokron
  deploymentTarget:
    iOS: "17.0"

packages:
  TarotAIPrototype:
    path: .

targets:
  TarotAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/TarotAI
    dependencies:
      - package: TarotAIPrototype
        product: TarotCore
    info:
      path: iOS/TarotAI/Info.plist
      properties:
        CFBundleDisplayName: AI Tarot
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nokron.tarotai
        PRODUCT_NAME: TarotAI
